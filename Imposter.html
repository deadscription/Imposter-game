<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Imposter Game</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #eee;
      text-align: center;
      padding: 30px 15px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { color: #ffb74d; }
    #playersList {
      margin: 25px auto;
      background: #1f1f1f;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    #playersUl {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    #playersUl li {
      background: #333;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .player-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }
    input[type=text], select {
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
      background: #1f1f1f;
      color: #fff;
      width: 80%;
    }
    button {
      padding: 12px 24px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    #joinBtn { background: #4caf50; color: white; }
    #revealBtn { background: #2196f3; color: white; }
    #newRoundBtn { background: #f44336; color: white; }
    #wordBox {
      margin: 20px auto;
      padding: 20px;
      background: #333;
      border-radius: 10px;
      border: 2px solid #ffb74d;
      font-size: 1.4em;
    }
    .local-player { border: 1px solid #ffb74d; }
  </style>
</head>
<body>

  <h1>🎭 Imposter Game</h1>

  <div id="joinScreen">
    <input id="nameInput" type="text" placeholder="Enter your name..." />
    <button id="joinBtn">Join Game</button>
  </div>

  <div id="playersList" style="display:none;">
    <h3>🧑‍🤝‍🧑 Players</h3>
    <ul id="playersUl"></ul>
  </div>

  <div id="categorySection" style="display:none;">
    <h3>🎯 Select a Category</h3>
    <select id="categorySelect">
      <option value="animals">Animals</option>
      <option value="food">Food</option>
      <option value="places">Places</option>
      <option value="objects">Objects</option>
    </select>
    <br>
    <button id="chooseCategoryBtn" style="background:#ffb74d;">Pick Word & Start</button>
  </div>

  <div id="gameUI">
    <div id="waitingCategoryMessage" style="color:#aaa; margin: 20px;"></div>
    <div id="chosenCategory" style="font-size: 1.2em; color: #ffb74d; margin-bottom: 10px;"></div>
    <button id="revealBtn" style="display:none;">Reveal Word</button>
    <div id="wordBox" style="display:none;"></div>
    <br>
    <button id="newRoundBtn" style="display:none;">Next Round (Reset Everyone)</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    // 1. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDvpa6IP-gjyVVg_lFizwMNjflqbJMw2uQ",
      authDomain: "imposter-game-515d8.firebaseapp.com",
      databaseURL: "https://imposter-game-515d8-default-rtdb.firebaseio.com",
      projectId: "imposter-game-515d8",
      storageBucket: "imposter-game-515d8.firebasestorage.app",
      messagingSenderId: "727642877069",
      appId: "1:727642877069:web:35f0113718fdde270b06c4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

      let playerName = null;
      let playerIndex = null;
      let isHost = false;

    const wordBank = {
      animals: ["Lion", "Penguin", "Elephant", "Giraffe", "Hamster", "Shark"],
      food: ["Pizza", "Sushi", "Taco", "Burger", "Pancake", "Pasta"],
      places: ["Paris", "Jungle", "Hospital", "Space Station", "Library", "Beach"],
      objects: ["Guitar", "Smartphone", "Telescope", "Umbrella", "Hammer", "Clock"]
    };

    // 2. Auth and Global Init
    firebase.auth().signInAnonymously().then(() => {
      db.ref("games/currentRound").on("value", snapshot => {
        const seed = snapshot.val();
        if (seed) startRound(seed);
      });
    });

    // 3. Main Game Logic
    function startRound(seed) {
  // 1. Reset UI to 'Join' state
  document.getElementById("joinScreen").style.display = "block";
  document.getElementById("playersList").style.display = "none";
  document.getElementById("categorySection").style.display = "none";
  document.getElementById("revealBtn").style.display = "none";
  document.getElementById("wordBox").style.display = "none";
  document.getElementById("newRoundBtn").style.display = "none";
  document.getElementById("waitingCategoryMessage").textContent = "";
  document.getElementById("chosenCategory").textContent = "";
  
  // 2. Clear the players list visually
  document.getElementById("playersUl").innerHTML = "";

  // 3. Point to the new database location
  const sessionRef = db.ref("games/" + seed);
  const playersRef = sessionRef.child("players");
  
  // Elements
  const joinScreen = document.getElementById("joinScreen");
  const nameInput = document.getElementById("nameInput");
  const joinBtn = document.getElementById("joinBtn");
  const playersListDiv = document.getElementById("playersList");
  const playersUl = document.getElementById("playersUl");
  const categorySection = document.getElementById("categorySection");
  const categorySelect = document.getElementById("categorySelect");
  const chooseCategoryBtn = document.getElementById("chooseCategoryBtn");
  const chosenCategoryDiv = document.getElementById("chosenCategory");
  const revealBtn = document.getElementById("revealBtn");
  const wordBox = document.getElementById("wordBox");
  const newRoundBtn = document.getElementById("newRoundBtn");
  const waitingCategoryMessage = document.getElementById("waitingCategoryMessage");

      // STEP 1: RESET UI FOR EVERYONE ON NEW ROUND
      joinScreen.style.display = "block";
      playersListDiv.style.display = "none";
      categorySection.style.display = "none";
      revealBtn.style.display = "none";
      wordBox.style.display = "none";
      newRoundBtn.style.display = "none";
      waitingCategoryMessage.textContent = "";
      chosenCategoryDiv.textContent = "";
      playersUl.innerHTML = "";

      const sessionRef = db.ref("games/" + seed);
      const playersRef = sessionRef.child("players");
      

      // STEP 2: JOIN LOGIC
document.getElementById("joinBtn").onclick = () => {
    const name = document.getElementById("nameInput").value.trim();
    if (!name) return alert("Enter a name!");

    // This safely adds you to the player list even if others join at the same time
    playersRef.transaction((currentData) => {
      if (currentData === null) return [{ name: name, color: "#90caf9" }];
      currentData.push({ name: name, color: "#90caf9" });
      return currentData;
    }, (error, committed, snapshot) => {
      if (committed) {
        const players = snapshot.val();
        playerIndex = players.length - 1; // Your ID in this round
        playerName = name;
        isHost = (playerIndex === 0); // Are you the first one?

        document.getElementById("joinScreen").style.display = "none";
        document.getElementById("playersList").style.display = "block";
        
        if (isHost) {
          document.getElementById("categorySection").style.display = "block";
        } else {
          document.getElementById("waitingCategoryMessage").textContent = "Waiting for host to pick a category";
        }
      }
    });
  };

      // STEP 3: HOST PICKS CATEGORY
      chooseCategoryBtn.onclick = () => {
        const cat = categorySelect.value;
        playersRef.once("value").then(snap => {
          const players = snap.val() || [];
          const randomWord = wordBank[cat][Math.floor(Math.random() * wordBank[cat].length)];
          const randomImposter = Math.floor(Math.random() * players.length);

          sessionRef.update({
            category: cat,
            word: randomWord,
            imposter: randomImposter
          });
          categorySection.style.display = "none";
        });
      };

      // STEP 4: LISTEN FOR PLAYERS
      playersRef.on("value", snap => {
        playersUl.innerHTML = "";
        const players = snap.val() || [];
        players.forEach((p, idx) => {
          if (!p) return;
          const li = document.createElement("li");
          if (p.name === playerName) li.className = "local-player";
          li.innerHTML = `<span class="player-badge" style="background:${p.color}"></span> ${p.name} ${idx === 0 ? "👑" : ""}`;
          playersUl.appendChild(li);
        });
      });

      // STEP 5: LISTEN FOR GAME DATA
      sessionRef.on("value", snap => {
        const data = snap.val();
        if (data && data.category && playerName) {
          waitingCategoryMessage.textContent = "";
          chosenCategoryDiv.textContent = "Word Category is: " + data.category.toUpperCase();
          revealBtn.style.display = "inline-block";
          
          if (isHost) {
            newRoundBtn.style.display = "inline-block";
            newRoundBtn.onclick = () => {
              db.ref("games/currentRound").set(Math.floor(Math.random() * 999999));
            };
          }

          revealBtn.onclick = () => {
            const isImposter = (playerIndex === data.imposter);
            if (wordBox.style.display === "none") {
              wordBox.innerHTML = isImposter ? "❗ You are the <b>IMPOSTER</b>" : `🗝️ Word: <b>${data.word}</b>`;
              wordBox.style.display = "block";
              revealBtn.textContent = "Hide Word";
            } else {
              wordBox.style.display = "none";
              revealBtn.textContent = "Reveal Word";
            }
          };
        }
      });
    }
  </script>
</body>
</html>
