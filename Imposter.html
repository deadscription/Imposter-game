<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🐺 Wolf in the Fold</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #eee;
      text-align: center;
      padding: 30px 15px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { color: #ffb74d; }
    #playersList {
      margin: 25px auto;
      background: #1f1f1f;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    #playersUl {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    #playersUl li { background: #333; padding: 8px 12px; border-radius: 8px; }
    .player-badge { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    input[type=text], select {
      padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px;
      background: #1f1f1f; color: #fff; width: 80%;
    }
    button {
      padding: 12px 24px; font-size: 1em; border: none; border-radius: 8px;
      cursor: pointer; margin: 5px; transition: opacity 0.3s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #joinBtn { background: #4caf50; color: white; }
    #revealBtn { background: #2196f3; color: white; }
    #newRoundBtn { background: #ffb74d; color: #111; font-weight: bold; }
    #exitGameBtn { background: #f44336; color: white; }
    #wordBox {
      margin: 20px auto; padding: 20px; background: #333;
      border-radius: 10px; border: 2px solid #ffb74d; font-size: 1.4em;
    }
    .local-player { border: 1px solid #ffb74d; }

    /* Result Popup Overlay */
    #resultOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center;
    }
    .result-content {
      background: #1f1f1f; padding: 30px; border-radius: 15px;
      border: 2px solid #ffb74d; text-align: center; max-width: 80%;
    }

    /* Debug Toast */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border-radius: 30px; color: white; display: none; z-index: 1000;
    }
    #toast.show { display: block; animation: fadeInOut 3s forwards; }
    @keyframes fadeInOut { 0%, 100% { opacity: 0; } 15%, 85% { opacity: 1; } }
  </style>
</head>

    function showDebugToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.background = "#4caf50";
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    function getDynamicWord(catKey) {
      const list = categories[catKey];
      if (list && list.length > 0) {
        return list[Math.floor(Math.random() * list.length)].toUpperCase();
      }
      return "ERROR";
    }

    document.getElementById("joinBtn").onclick = function() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name || !currentSeed) return;
      const ref = db.ref("games/" + currentSeed + "/players");
      ref.once("value").then(snap => {
        const players = snap.val() || [];
        playerIndex = Array.isArray(players) ? players.length : Object.keys(players).length;
        playerName = name; isHost = (playerIndex === 0);
        return ref.child(playerIndex).set({ name, color: "#90caf9" });
      }).then(() => {
        document.getElementById("joinScreen").style.display = "none";
        document.getElementById("playersList").style.display = "block";
      });
    };

    document.getElementById("chooseCategoryBtn").onclick = function() {
      const catKey = document.getElementById("categorySelect").value;
      if(!catKey) return alert("Select a category!");
      
      const word = getDynamicWord(catKey);
      const sessionRef = db.ref("games/" + currentSeed);
      sessionRef.child("players").once("value").then(snap => {
        const pCount = Object.keys(snap.val() || {}).length;
        const imposter = Math.floor(Math.random() * pCount);
        sessionRef.update({ 
          category: catKey.replace('_', ' '), 
          word, 
          imposter, 
          showResults: false 
        });
      });
    };

    document.getElementById("newRoundBtn").onclick = () => db.ref("games/" + currentSeed).update({ showResults: true });
    
    document.getElementById("exitGameBtn").onclick = () => {
      if(confirm("End the game and clear the fold?")) {
        db.ref("games/" + currentSeed).remove().then(() => {
          db.ref("games/currentRound").set(Math.floor(Math.random() * 999999));
        });
      }
    };

    firebase.auth().signInAnonymously().then(() => {
      db.ref("games/currentRound").on("value", snapshot => {
        const ns = snapshot.val();
        if (currentSeed && ns !== currentSeed) { playerName = null; playerIndex = null; isHost = false; }
        currentSeed = ns;
        if (currentSeed) { resetGameUI(); attachListeners(currentSeed); }
        else db.ref("games/currentRound").set(Math.floor(Math.random() * 999999));
      });
    });

    function resetGameUI() {
      document.getElementById("joinScreen").style.display = playerName ? "none" : "block";
      document.getElementById("playersList").style.display = playerName ? "block" : "none";
      document.getElementById("categorySection").style.display = "none";
      document.getElementById("revealBtn").style.display = "none";
      document.getElementById("revealBtn").textContent = "Reveal Secret";
      document.getElementById("wordBox").style.display = "none";
      document.getElementById("newRoundBtn").style.display = "none";
      document.getElementById("exitGameBtn").style.display = "none";
      document.getElementById("chosenCategory").textContent = "";
      document.getElementById("waitingCategoryMessage").textContent = (playerName && !isHost) ? "Waiting for the Host to set the fold..." : "";
      document.getElementById("playersUl").innerHTML = "";
      document.getElementById("resultOverlay").style.display = "none";
      
      const sel = document.getElementById("categorySelect");
      if (sel.options.length <= 1) {
        Object.keys(categories).forEach(k => {
          let o = document.createElement('option'); o.value = k; o.innerHTML = k.replace('_', ' ').toUpperCase();
          sel.appendChild(o);
        });
      }
    }

    function attachListeners(seed) {
      const sessionRef = db.ref("games/" + seed);
      sessionRef.child("players").on("value", snap => {
        const ul = document.getElementById("playersUl"); ul.innerHTML = "";
        Object.values(snap.val() || {}).forEach((p, i) => {
          const li = document.createElement("li");
          if (p.name === playerName && i === playerIndex) li.className = "local-player";
          li.innerHTML = `<span class="player-badge" style="background:${p.color}"></span> ${p.name} ${i === 0 ? "👑" : ""}`;
          ul.appendChild(li);
        });
      });

      sessionRef.on("value", snap => {
        const d = snap.val();
        if (!snap.exists()) { resetGameUI(); return; }

        if (d.showResults && d.category) {
          const playersArr = Object.values(d.players || {});
          const impName = playersArr[d.imposter] ? playersArr[d.imposter].name : "Unknown";
          document.getElementById("resultText").innerHTML = `The Wolf was: <b style="color:#ffb74d;">${impName}</b><br>Secret Word: <b style="color:#2196f3;">${d.word}</b>`;
          document.getElementById("resultOverlay").style.display = "flex";
          document.getElementById("closeResultBtn").onclick = () => {
            document.getElementById("resultOverlay").style.display = "none";
            if (isHost) sessionRef.update({ category: null, word: null, imposter: null, showResults: false });
          };
        }

        if (!d.category) {
          document.getElementById("revealBtn").style.display = "none";
          document.getElementById("revealBtn").textContent = "Reveal Secret";
          document.getElementById("wordBox").style.display = "none";
          document.getElementById("chosenCategory").textContent = "";
          if (playerName && isHost) { document.getElementById("categorySection").style.display = "block"; document.getElementById("exitGameBtn").style.display = "inline-block"; }
          if (playerName && !isHost) document.getElementById("waitingCategoryMessage").textContent = "Waiting for Host...";
          return;
        }

        if (d.category && playerName) {
          document.getElementById("waitingCategoryMessage").textContent = "";
          document.getElementById("categorySection").style.display = "none";
          document.getElementById("chosenCategory").textContent = "Category: " + d.category.toUpperCase();
          document.getElementById("revealBtn").style.display = "inline-block";
          if (isHost) { document.getElementById("newRoundBtn").style.display = "inline-block"; document.getElementById("exitGameBtn").style.display = "inline-block"; }
          document.getElementById("revealBtn").onclick = () => {
            const wb = document.getElementById("wordBox");
            if (wb.style.display === "none") {
              wb.innerHTML = (playerIndex == d.imposter) ? "🐺 You are the <b>WOLF</b>" : `🗝️ Secret Word: <b>${d.word}</b>`;
              wb.style.display = "block";
              document.getElementById("revealBtn").textContent = "Hide Secret";
            } else { wb.style.display = "none"; document.getElementById("revealBtn").textContent = "Reveal Secret"; }
          };
        }
      });
    }
  </script>
