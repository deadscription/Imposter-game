<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Imposter Game</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #eee;
      text-align: center;
      padding: 30px 15px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { color: #ffb74d; }
    #playersList {
      margin: 25px auto;
      background: #1f1f1f;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    #playersUl {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    #playersUl li {
      background: #333;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .player-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }
    input[type=text], select {
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
      background: #1f1f1f;
      color: #fff;
      width: 80%;
    }
    button {
      padding: 12px 24px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    #joinBtn { background: #4caf50; color: white; }
    #revealBtn { background: #2196f3; color: white; }
    #newRoundBtn { background: #f44336; color: white; }
    #wordBox {
      margin: 20px auto;
      padding: 20px;
      background: #333;
      border-radius: 10px;
      border: 2px solid #ffb74d;
      font-size: 1.4em;
    }
    .local-player { border: 1px solid #ffb74d; }
  </style>
</head>
<body>

  <h1>🎭 Imposter Game</h1>

  <div id="joinScreen">
    <input id="nameInput" type="text" placeholder="Enter your name..." />
    <button id="joinBtn">Join Game</button>
  </div>

  <div id="playersList" style="display:none;">
    <h3>🧑‍🤝‍🧑 Players</h3>
    <ul id="playersUl"></ul>
  </div>

  <div id="categorySection" style="display:none;">
    <h3>🎯 Select a Category</h3>
    <select id="categorySelect">
      <option value="animals">Animals</option>
      <option value="food">Food</option>
      <option value="places">Places</option>
      <option value="objects">Objects</option>
    </select>
    <br>
    <button id="chooseCategoryBtn" style="background:#ffb74d;">Pick Word & Start</button>
  </div>

  <div id="gameUI">
    <div id="waitingCategoryMessage" style="color:#aaa; margin: 20px;"></div>
    <div id="chosenCategory" style="font-size: 1.2em; color: #ffb74d; margin-bottom: 10px;"></div>
    <button id="revealBtn" style="display:none;">Reveal Word</button>
    <div id="wordBox" style="display:none;"></div>
    <br>
    <button id="newRoundBtn" style="display:none;">Start New Round</button>
    <button id="exitGameBtn" style="display:none; background:#d32f2f;">Exit Game (Reset All)</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
// 1. Firebase Configuration (Keep your existing details)
  const firebaseConfig = {
    apiKey: "AIzaSyDvpa6IP-gjyVVg_lFizwMNjflqbJMw2uQ",
    authDomain: "imposter-game-515d8.firebaseapp.com",
    databaseURL: "https://imposter-game-515d8-default-rtdb.firebaseio.com",
    projectId: "imposter-game-515d8",
    storageBucket: "imposter-game-515d8.firebasestorage.app",
    messagingSenderId: "727642877069",
    appId: "1:727642877069:web:35f0113718fdde270b06c4"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let playerName = null;
  let playerIndex = null;
  let isHost = false;
  let currentSeed = null;

  const categories = {
    animals: ["Lion", "Tiger", "Elephant", "Zebra", "Monkey"],
    colors: ["Red", "Blue", "Yellow", "Green", "Purple"],
    countries: ["USA", "Japan", "France", "Brazil", "India"],
    kitchen_utensils: ["Spoon", "Fork", "Knife", "Plate", "Bowl"],
    clothing: ["Shirt", "Pants", "Hat", "Socks", "Jacket"],
    household_appliances: ["Fridge", "Microwave", "Toaster", "Vacuum", "Washer"],
    footwear: ["Sneakers", "Boots", "Sandals", "Slippers", "Heels"],
    landmarks: ["Eiffel Tower", "Pyramids", "Big Ben", "Grand Canyon"],
    weather: ["Rain", "Snow", "Sunny", "Storm", "Windy"],
    trees: ["Oak", "Palm", "Pine", "Maple", "Willow"],
    insects: ["Bee", "Ant", "Butterfly", "Spider", "Fly"],
    fruits_veg: ["Apple", "Banana", "Carrot", "Potato", "Tomato"],
    desserts: ["Cake", "Cookie", "Ice Cream", "Pie", "Donut"],
    breakfast: ["Eggs", "Pancakes", "Toast", "Cereal", "Bacon"],
    olympic_sports: ["Soccer", "Swimming", "Running", "Tennis", "Boxing"],
    musical_instruments: ["Piano", "Guitar", "Drums", "Violin", "Flute"],
    art_supplies: ["Paint", "Brush", "Pencil", "Paper", "Crayon"],
    board_games: ["Chess", "Monopoly", "Checkers", "Dice", "Cards"],
    space: ["Moon", "Sun", "Star", "Planet", "Rocket"],
    vehicles: ["Car", "Bus", "Train", "Plane", "Boat"],
    car_parts: ["Wheel", "Engine", "Door", "Brake", "Mirror"],
    occupations: ["Doctor", "Teacher", "Pilot", "Nurse", "Chef"],
    superpowers: ["Flight", "Invisibility", "Strength", "Speed"],
    characters: ["Batman", "Mickey Mouse", "Spiderman", "Superman"],
    mythical: ["Dragon", "Unicorn", "Ghost", "Mermaid", "Vampire"],
    body_parts: ["Eye", "Hand", "Foot", "Nose", "Ear"],
    shapes: ["Circle", "Square", "Triangle", "Star", "Heart"],
    flowers: ["Rose", "Tulip", "Daisy", "Sunflower", "Lily"],
    school_subjects: ["Math", "Science", "History", "Art", "Music"],
    activities: ["Running", "Cooking", "Sleeping", "Eating", "Reading"]
  };

  // --- DEBUG TOAST FUNCTION ---
  function showDebugToast(msg, type) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.style.background = type === "api" ? "#2196f3" : "#ff9800";
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
    console.log(`DEBUG: ${msg}`);
  }

  // --- WORD FETCHER ---
  async function getDynamicWord(categoryKey) {
    const query = categoryKey.replace('_', ' ');
    try {
      const response = await fetch(`https://api.datamuse.com/words?ml=${query}&max=30`);
      const data = await response.json();
      const filtered = data.filter(w => !w.word.includes(' ') && w.word.length > 2);
      
      if (filtered.length > 5) {
        const word = filtered[Math.floor(Math.random() * Math.min(filtered.length, 12))].word.toUpperCase();
        showDebugToast(`Source: Datamuse API (${word})`, "api");
        return word;
      }
      throw new Error("API results too low");
    } catch (e) {
      const list = categories[categoryKey];
      const word = list[Math.floor(Math.random() * list.length)].toUpperCase();
      showDebugToast(`Source: Local Backup (${word})`, "local");
      return word;
    }
  }

  // --- BUTTONS ---
  document.getElementById("joinBtn").onclick = function() {
    const name = document.getElementById("nameInput").value.trim();
    if (!name || !currentSeed) return;
    const playersRef = db.ref("games/" + currentSeed + "/players");
    playersRef.once("value").then(snap => {
      const playerList = Object.values(snap.val() || {});
      playerIndex = playerList.length;
      playerName = name;
      isHost = (playerIndex === 0);
      return playersRef.child(playerIndex).set({ name, color: "#90caf9" });
    }).then(() => {
      document.getElementById("joinScreen").style.display = "none";
      document.getElementById("playersList").style.display = "block";
      if (isHost) document.getElementById("categorySection").style.display = "block";
    });
  };

  document.getElementById("chooseCategoryBtn").onclick = async function() {
    const btn = document.getElementById("chooseCategoryBtn");
    const catKey = document.getElementById("categorySelect").value;
    btn.disabled = true;
    btn.textContent = "Fetching...";
    
    const word = await getDynamicWord(catKey);
    const sessionRef = db.ref("games/" + currentSeed);
    const playersSnap = await sessionRef.child("players").once("value");
    const imposter = Math.floor(Math.random() * Object.keys(playersSnap.val()).length);

    await sessionRef.update({ category: catKey.replace('_', ' '), word, imposter });
    btn.disabled = false;
    btn.textContent = "Pick Word & Start";
  };

  document.getElementById("newRoundBtn").onclick = () => db.ref("games/" + currentSeed).update({ category: null, word: null, imposter: null });
  document.getElementById("exitGameBtn").onclick = () => { if(confirm("Exit?")) db.ref("games/"+currentSeed).remove().then(() => db.ref("games/currentRound").set(Math.floor(Math.random()*999999))); };

  // --- ENGINE ---
  firebase.auth().signInAnonymously().then(() => {
    db.ref("games/currentRound").on("value", snapshot => {
      const newSeed = snapshot.val();
      if (currentSeed && newSeed !== currentSeed) { playerName = null; playerIndex = null; isHost = false; }
      currentSeed = newSeed;
      if (currentSeed) { resetGameUI(); attachFirebaseListeners(currentSeed); }
      else db.ref("games/currentRound").set(Math.floor(Math.random()*999999));
    });
  });

  function resetGameUI() {
    document.getElementById("joinScreen").style.display = playerName ? "none" : "block";
    document.getElementById("playersList").style.display = playerName ? "block" : "none";
    document.getElementById("categorySection").style.display = "none";
    document.getElementById("revealBtn").style.display = "none";
    document.getElementById("wordBox").style.display = "none";
    document.getElementById("newRoundBtn").style.display = "none";
    document.getElementById("exitGameBtn").style.display = "none";
    document.getElementById("chosenCategory").textContent = "";
    document.getElementById("waitingCategoryMessage").textContent = (playerName && !isHost) ? "Waiting for host..." : "";
    document.getElementById("playersUl").innerHTML = "";
    const select = document.getElementById("categorySelect");
    if (select.options.length <= 1) {
      Object.keys(categories).forEach(cat => {
        let opt = document.createElement('option');
        opt.value = cat; opt.innerHTML = cat.replace('_', ' ').toUpperCase();
        select.appendChild(opt);
      });
    }
  }

  function attachFirebaseListeners(seed) {
    const sessionRef = db.ref("games/" + seed);
    sessionRef.child("players").on("value", snap => {
      const ul = document.getElementById("playersUl"); ul.innerHTML = "";
      Object.values(snap.val() || {}).forEach((p, i) => {
        const li = document.createElement("li");
        if (p.name === playerName && i === playerIndex) li.className = "local-player";
        li.innerHTML = `<span class="player-badge" style="background:${p.color}"></span> ${p.name} ${i === 0 ? "👑" : ""}`;
        ul.appendChild(li);
      });
    });

    sessionRef.on("value", snap => {
      const data = snap.val();
      if (!snap.exists()) { resetGameUI(); return; }
      if (!data.category) {
        document.getElementById("revealBtn").style.display = "none";
        document.getElementById("wordBox").style.display = "none";
        document.getElementById("chosenCategory").textContent = "";
        if (playerName && isHost) { document.getElementById("categorySection").style.display = "block"; document.getElementById("exitGameBtn").style.display = "inline-block"; }
        if (playerName && !isHost) document.getElementById("waitingCategoryMessage").textContent = "Waiting for host...";
        return;
      }
      if (data.category && playerName) {
        document.getElementById("waitingCategoryMessage").textContent = "";
        document.getElementById("categorySection").style.display = "none";
        document.getElementById("chosenCategory").textContent = "Category: " + data.category.toUpperCase();
        document.getElementById("revealBtn").style.display = "inline-block";
        if (isHost) { document.getElementById("newRoundBtn").style.display = "inline-block"; document.getElementById("exitGameBtn").style.display = "inline-block"; }
        document.getElementById("revealBtn").onclick = () => {
          const wb = document.getElementById("wordBox");
          if (wb.style.display === "none") {
            wb.innerHTML = (playerIndex == data.imposter) ? "❗ You are the <b>IMPOSTER</b>" : `🗝️ Word: <b>${data.word}</b>`;
            wb.style.display = "block";
            document.getElementById("revealBtn").textContent = "Hide Word";
          } else { wb.style.display = "none"; document.getElementById("revealBtn").textContent = "Reveal Word"; }
        };
      }
    });
  }
</script>
