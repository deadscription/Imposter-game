<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Imposter Game</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #eee;
      text-align: center;
      padding: 30px 15px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { color: #ffb74d; }
    #playersList {
      margin: 25px auto;
      background: #1f1f1f;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    #playersUl {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    #playersUl li {
      background: #333;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .player-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }
    input[type=text], select {
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
      background: #1f1f1f;
      color: #fff;
      width: 80%;
    }
    button {
      padding: 12px 24px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    #joinBtn { background: #4caf50; color: white; }
    #revealBtn { background: #2196f3; color: white; }
    #newRoundBtn { background: #f44336; color: white; }
    #wordBox {
      margin: 20px auto;
      padding: 20px;
      background: #333;
      border-radius: 10px;
      border: 2px solid #ffb74d;
      font-size: 1.4em;
    }
    .local-player { border: 1px solid #ffb74d; }
  </style>
</head>
<body>

  <h1>🎭 Imposter Game</h1>

  <div id="joinScreen">
    <input id="nameInput" type="text" placeholder="Enter your name..." />
    <button id="joinBtn">Join Game</button>
  </div>

  <div id="playersList" style="display:none;">
    <h3>🧑‍🤝‍🧑 Players</h3>
    <ul id="playersUl"></ul>
  </div>

  <div id="categorySection" style="display:none;">
    <h3>🎯 Select a Category</h3>
    <select id="categorySelect">
      <option value="animals">Animals</option>
      <option value="food">Food</option>
      <option value="places">Places</option>
      <option value="objects">Objects</option>
    </select>
    <br>
    <button id="chooseCategoryBtn" style="background:#ffb74d;">Pick Word & Start</button>
  </div>

  <div id="gameUI">
    <div id="waitingCategoryMessage" style="color:#aaa; margin: 20px;"></div>
    <div id="chosenCategory" style="font-size: 1.2em; color: #ffb74d; margin-bottom: 10px;"></div>
    <button id="revealBtn" style="display:none;">Reveal Word</button>
    <div id="wordBox" style="display:none;"></div>
    <br>
    <button id="newRoundBtn" style="display:none;">Start New Round</button>
    <button id="exitGameBtn" style="display:none; background:#d32f2f;">Exit Game (Reset All)</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
// 1. Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDvpa6IP-gjyVVg_lFizwMNjflqbJMw2uQ",
    authDomain: "imposter-game-515d8.firebaseapp.com",
    databaseURL: "https://imposter-game-515d8-default-rtdb.firebaseio.com",
    projectId: "imposter-game-515d8",
    storageBucket: "imposter-game-515d8.firebasestorage.app",
    messagingSenderId: "727642877069",
    appId: "1:727642877069:web:35f0113718fdde270b06c4"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Global State
  let playerName = null;
  let playerIndex = null;
  let isHost = false;
  let currentSeed = null;

  const wordBank = {
    animals: ["Lion", "Penguin", "Elephant", "Giraffe", "Hamster", "Shark"],
    food: ["Pizza", "Sushi", "Taco", "Burger", "Pancake", "Pasta"],
    places: ["Paris", "Jungle", "Hospital", "Space Station", "Library", "Beach"],
    objects: ["Guitar", "Smartphone", "Telescope", "Umbrella", "Hammer", "Clock"]
  };

  // --- BUTTON LISTENERS (Defined Once) ---

  document.getElementById("joinBtn").onclick = function() {
    const name = document.getElementById("nameInput").value.trim();
    if (!name || !currentSeed) return alert("Connecting to server... please wait.");

    const playersRef = db.ref("games/" + currentSeed + "/players");

    playersRef.once("value").then(snap => {
      const players = snap.val() || [];
      const playerList = Array.isArray(players) ? players : Object.values(players);
      
      playerIndex = playerList.length;
      playerName = name;
      isHost = (playerIndex === 0);

      return playersRef.child(playerIndex).set({ name: name, color: "#90caf9" });
    }).then(() => {
      document.getElementById("joinScreen").style.display = "none";
      document.getElementById("playersList").style.display = "block";
      if (isHost) document.getElementById("categorySection").style.display = "block";
      else document.getElementById("waitingCategoryMessage").textContent = "Waiting for host to pick a category...";
    });
  };

  document.getElementById("chooseCategoryBtn").onclick = function() {
    if (!isHost || !currentSeed) return;
    const cat = document.getElementById("categorySelect").value;
    const sessionRef = db.ref("games/" + currentSeed);
    
    sessionRef.child("players").once("value").then(snap => {
      const players = snap.val() || [];
      const playerList = Array.isArray(players) ? players : Object.values(players);
      const randomWord = wordBank[cat][Math.floor(Math.random() * wordBank[cat].length)];
      const randomImposter = Math.floor(Math.random() * playerList.length);

      sessionRef.update({
        category: cat,
        word: randomWord,
        imposter: randomImposter
      });
    });
  };

  document.getElementById("newRoundBtn").onclick = function() {
    if (!isHost || !currentSeed) return;
    // SOFT RESET: Clear game data but keep players
    db.ref("games/" + currentSeed).update({
      category: null,
      word: null,
      imposter: null
    });
  };

  document.getElementById("exitGameBtn").onclick = function() {
    if (!isHost || !currentSeed) return;
    if (!confirm("This will delete the game and kick everyone out. Proceed?")) return;

    const oldSeed = currentSeed;
    // HARD RESET: Delete entire session and change the global seed
    db.ref("games/" + oldSeed).remove().then(() => {
      return db.ref("games/currentRound").set(Math.floor(Math.random() * 999999));
    });
  };

  // --- CORE GAME ENGINE ---

  firebase.auth().signInAnonymously().then(() => {
    db.ref("games/currentRound").on("value", snapshot => {
      const newSeed = snapshot.val();
      
      // If seed changed (Hard Reset), force everyone to join screen
      if (currentSeed && newSeed !== currentSeed) {
        playerName = null;
        playerIndex = null;
        isHost = false;
      }
      
      currentSeed = newSeed;
      if (currentSeed) {
        resetGameUI();
        attachFirebaseListeners(currentSeed);
      } else {
        // First time initialization
        db.ref("games/currentRound").set(Math.floor(Math.random() * 999999));
      }
    });
  });

  function resetGameUI() {
    document.getElementById("joinScreen").style.display = playerName ? "none" : "block";
    document.getElementById("playersList").style.display = playerName ? "block" : "none";
    document.getElementById("categorySection").style.display = "none";
    document.getElementById("revealBtn").style.display = "none";
    document.getElementById("wordBox").style.display = "none";
    document.getElementById("newRoundBtn").style.display = "none";
    document.getElementById("exitGameBtn").style.display = "none";
    document.getElementById("chosenCategory").textContent = "";
    document.getElementById("waitingCategoryMessage").textContent = (playerName && !isHost) ? "Waiting for host..." : "";
    document.getElementById("playersUl").innerHTML = "";
  }

  function attachFirebaseListeners(seed) {
    const sessionRef = db.ref("games/" + seed);

    // Sync Players
    sessionRef.child("players").on("value", snap => {
      const playersUl = document.getElementById("playersUl");
      playersUl.innerHTML = "";
      const players = snap.val() || [];
      Object.values(players).forEach((p, idx) => {
        const li = document.createElement("li");
        if (p.name === playerName && idx === playerIndex) li.className = "local-player";
        li.innerHTML = `<span class="player-badge" style="background:${p.color}"></span> ${p.name} ${idx === 0 ? "👑" : ""}`;
        playersUl.appendChild(li);
      });
    });

    // Sync Game State
    sessionRef.on("value", snap => {
      const data = snap.val();
      
      // If session was deleted by host (Hard Reset)
      if (!snap.exists()) {
        resetGameUI();
        return;
      }

      // If game is in "Waiting" state (Soft Reset)
      if (!data.category) {
        document.getElementById("revealBtn").style.display = "none";
        document.getElementById("wordBox").style.display = "none";
        document.getElementById("chosenCategory").textContent = "";
        if (playerName && isHost) {
          document.getElementById("categorySection").style.display = "block";
          document.getElementById("exitGameBtn").style.display = "inline-block";
        }
        if (playerName && !isHost) {
          document.getElementById("waitingCategoryMessage").textContent = "Waiting for host to pick a category...";
        }
        return;
      }

      // If game is Active
      if (data.category && playerName) {
        document.getElementById("waitingCategoryMessage").textContent = "";
        document.getElementById("categorySection").style.display = "none";
        document.getElementById("chosenCategory").textContent = "Category: " + data.category.toUpperCase();
        document.getElementById("revealBtn").style.display = "inline-block";
        
        if (isHost) {
          document.getElementById("newRoundBtn").style.display = "inline-block";
          document.getElementById("exitGameBtn").style.display = "inline-block";
        }

        document.getElementById("revealBtn").onclick = () => {
          const wordBox = document.getElementById("wordBox");
          const isImposter = (playerIndex == data.imposter);
          if (wordBox.style.display === "none") {
            wordBox.innerHTML = isImposter ? "❗ You are the <b>IMPOSTER</b>" : `🗝️ Word: <b>${data.word}</b>`;
            wordBox.style.display = "block";
            document.getElementById("revealBtn").textContent = "Hide Word";
          } else {
            wordBox.style.display = "none";
            document.getElementById("revealBtn").textContent = "Reveal Word";
          }
        };
      }
    });
  }
</script>
</body>
</html>
