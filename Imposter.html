<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐺 Wolf in the Fold</title>
  <style>
    :root {
      --primary: #ffb74d;
      --bg: #121212;
      --card: #1f1f1f;
      --text: #eeeeee;
      --green: #4caf50;
      --blue: #2196f3;
      --red: #f44336;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      text-align: center;
      margin: 0;
      padding: 20px 10px;
      line-height: 1.4;
    }

    h1 { 
      color: var(--primary); 
      font-size: 1.8rem; 
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Layout Containers */
    .container {
      max-width: 450px;
      margin: 0 auto;
    }

    #playersList {
      margin: 15px 0;
      background: var(--card);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #playersUl {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    #playersUl li {
      background: #333;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .local-player { 
      border-color: var(--primary) !important;
      background: #443311 !important;
    }

    /* Form Elements */
    input[type=text], select {
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #333;
      margin-bottom: 15px;
      background: var(--card);
      color: #fff;
      width: 100%;
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--primary); }

    /* Button System */
    button {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; }

    #joinBtn { background: var(--green); color: white; }
    #revealBtn { background: var(--blue); color: white; margin-top: 10px; }
    #newRoundBtn { background: var(--primary); color: #111; }
    #exitGameBtn { background: transparent; color: #888; text-decoration: underline; font-size: 0.9rem; margin-top: 20px; }

    #wordBox {
      margin: 20px 0;
      padding: 25px;
      background: #2a2a2a;
      border-radius: 16px;
      border: 2px dashed var(--primary);
      font-size: 1.5rem;
      font-weight: bold;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { border-color: var(--primary); }
      50% { border-color: #ff8c00; }
      100% { border-color: var(--primary); }
    }

    /* Overlays */
    #resultOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center;
      padding: 20px;
    }
    .result-content {
      background: var(--card); padding: 30px; border-radius: 20px;
      border: 2px solid var(--primary); width: 100%; max-width: 350px;
    }

    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border-radius: 30px; background: var(--green);
      color: white; display: none; z-index: 1000; font-weight: bold;
    }
    #toast.show { display: block; animation: fadeInOut 3s forwards; }
    @keyframes fadeInOut { 0%, 100% { opacity: 0; } 15%, 85% { opacity: 1; } }

    .badge {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); margin-right: 5px;
    }
  </style>
</head>

  <div class="container">
    <h1>🐺 Wolf in the Fold</h1>

    <div id="joinScreen">
      <input id="nameInput" type="text" placeholder="Your Name" autocomplete="off" />
      <button id="joinBtn">Join the Pack</button>
    </div>

    <div id="playersList" style="display:none;">
      <h3 style="margin-top:0; font-size: 1rem; color: #888;">THE PACK</h3>
      <ul id="playersUl"></ul>
    </div>

    <div id="categorySection" style="display:none;">
      <h3 style="margin-bottom:10px;">Set the Fold</h3>
      <select id="categorySelect">
        <option value="">-- Choose Category --</option>
      </select>
      <button id="chooseCategoryBtn" style="background:var(--primary); color:#111;">Start Round</button>
    </div>

    <div id="gameUI">
      <div id="waitingCategoryMessage" style="color:#888; margin: 20px 0; font-style: italic;"></div>
      
      <div id="gameActiveArea" style="display:none;">
        <div id="chosenCategory" style="font-size: 1.1rem; color: var(--primary); font-weight: bold;"></div>
        <button id="revealBtn">Reveal Word</button>
        <div id="wordBox" style="display:none;"></div>
      </div>

      <div id="hostControls" style="margin-top: 30px;">
        <button id="newRoundBtn" style="display:none;">Next Round</button>
        <button id="exitGameBtn" style="display:none;">End Session</button>
      </div>
    </div>
  </div>

  <div id="resultOverlay">
    <div class="result-content">
      <h2 style="color:var(--primary); margin-top:0;">🏁 Results</h2>
      <p id="resultText" style="font-size:1.2rem; margin:20px 0;"></p>
      <button id="closeResultBtn" style="background:var(--green); color:white;">Continue</button>
    </div>
  </div>

  <div id="toast"></div>

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    function getWord(catKey) {
      const list = categories[catKey];
      return list ? list[Math.floor(Math.random() * list.length)].toUpperCase() : "ERROR";
    }

    // 3. Button Logic
    document.getElementById("joinBtn").onclick = () => {
      const name = document.getElementById("nameInput").value.trim();
      if (!name || !currentSeed) return;
      const ref = db.ref(`games/${currentSeed}/players`);
      ref.once("value").then(snap => {
        const p = snap.val() || [];
        playerIndex = Array.isArray(p) ? p.length : Object.keys(p).length;
        playerName = name; isHost = (playerIndex === 0);
        return ref.child(playerIndex).set({ name, color: "#90caf9" });
      }).then(() => {
        document.getElementById("joinScreen").style.display = "none";
        document.getElementById("playersList").style.display = "block";
      });
    };

    document.getElementById("chooseCategoryBtn").onclick = () => {
      const catKey = document.getElementById("categorySelect").value;
      if(!catKey) return alert("Pick a category!");
      const word = getWord(catKey);
      const sessionRef = db.ref(`games/${currentSeed}`);
      sessionRef.child("players").once("value").then(snap => {
        const imposter = Math.floor(Math.random() * Object.keys(snap.val()).length);
        sessionRef.update({ category: catKey.replace('_', ' '), word, imposter, showResults: false });
      });
    };

    document.getElementById("newRoundBtn").onclick = () => db.ref(`games/${currentSeed}`).update({ showResults: true });
    document.getElementById("exitGameBtn").onclick = () => {
      if(confirm("End game?")) db.ref(`games/${currentSeed}`).remove().then(() => db.ref("games/currentRound").set(Math.floor(Math.random() * 999999)));
    };

    // 4. Engine
    firebase.auth().signInAnonymously().then(() => {
      db.ref("games/currentRound").on("value", snapshot => {
        const ns = snapshot.val();
        if (currentSeed && ns !== currentSeed) { playerName = null; playerIndex = null; isHost = false; }
        currentSeed = ns;
        if (currentSeed) { resetGameUI(); attachListeners(currentSeed); }
        else db.ref("games/currentRound").set(Math.floor(Math.random() * 999999));
      });
    });

    function resetGameUI() {
      document.getElementById("joinScreen").style.display = playerName ? "none" : "block";
      document.getElementById("playersList").style.display = playerName ? "block" : "none";
      document.getElementById("categorySection").style.display = "none";
      document.getElementById("gameActiveArea").style.display = "none";
      document.getElementById("wordBox").style.display = "none";
      document.getElementById("revealBtn").textContent = "Reveal Word";
      document.getElementById("newRoundBtn").style.display = "none";
      document.getElementById("exitGameBtn").style.display = "none";
      document.getElementById("resultOverlay").style.display = "none";
      document.getElementById("waitingCategoryMessage").textContent = (playerName && !isHost) ? "Waiting for the Host..." : "";
      
      const sel = document.getElementById("categorySelect");
      if (sel.options.length <= 1) {
        Object.keys(categories).forEach(k => {
          let o = document.createElement('option'); o.value = k; o.innerHTML = k.replace('_', ' ').toUpperCase();
          sel.appendChild(o);
        });
      }
    }

    function attachListeners(seed) {
      const sessionRef = db.ref(`games/${seed}`);
      sessionRef.child("players").on("value", snap => {
        const ul = document.getElementById("playersUl"); ul.innerHTML = "";
        Object.values(snap.val() || {}).forEach((p, i) => {
          const li = document.createElement("li");
          if (p.name === playerName && i === playerIndex) li.className = "local-player";
          li.innerHTML = `<span class="badge"></span> ${p.name} ${i === 0 ? "👑" : ""}`;
          ul.appendChild(li);
        });
      });

      sessionRef.on("value", snap => {
        const d = snap.val();
        if (!snap || !snap.exists()) { resetGameUI(); return; }

        if (d.showResults && d.category) {
          const p = Object.values(d.players || {});
          const impName = p[d.imposter] ? p[d.imposter].name : "???";
          document.getElementById("resultText").innerHTML = `The Wolf was: <b style="color:var(--primary)">${impName}</b><br>Word: <b style="color:var(--blue)">${d.word}</b>`;
          document.getElementById("resultOverlay").style.display = "flex";
          document.getElementById("closeResultBtn").onclick = () => {
            document.getElementById("resultOverlay").style.display = "none";
            if (isHost) sessionRef.update({ category: null, word: null, imposter: null, showResults: false });
          };
        }

        if (!d.category) {
          document.getElementById("gameActiveArea").style.display = "none";
          if (playerName && isHost) {
            document.getElementById("categorySection").style.display = "block";
            document.getElementById("exitGameBtn").style.display = "block";
          }
          return;
        }

        if (d.category && playerName) {
          document.getElementById("waitingCategoryMessage").textContent = "";
          document.getElementById("categorySection").style.display = "none";
          document.getElementById("gameActiveArea").style.display = "block";
          document.getElementById("chosenCategory").textContent = "CATEGORY: " + d.category.toUpperCase();
          if (isHost) {
            document.getElementById("newRoundBtn").style.display = "block";
            document.getElementById("exitGameBtn").style.display = "block";
          }

          document.getElementById("revealBtn").onclick = () => {
            const wb = document.getElementById("wordBox");
            if (wb.style.display === "none") {
              wb.innerHTML = (playerIndex == d.imposter) ? "🐺 You are the <b>WOLF</b>" : `Word: <b>${d.word}</b>`;
              wb.style.display = "block";
              document.getElementById("revealBtn").textContent = "Hide Word";
            } else { wb.style.display = "none"; document.getElementById("revealBtn").textContent = "Reveal Word"; }
          };
        }
      });
    }
