<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Imposter Game</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #eee;
      text-align: center;
      padding: 30px 15px;
      overflow-x: hidden;
      max-width: 600px;
      margin: 0 auto;
    }
    @keyframes smoothReveal {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(8px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}
    #playersList div {
  margin: 4px 6px;
  display: inline-block;
  color: #ddd;
}

#playersList div span {
  color: #999;
  font-size: 0.9em;
}


.word-visible {
  animation: smoothReveal 0.5s ease forwards;
}


    h1 {
      font-size: 2.6em;
      margin-bottom: 20px;
      color: #ffb74d;
      text-shadow: 0 0 8px rgba(255,183,77,0.5);
    }

    #playersList {
      margin: 25px auto;
      background: #1f1f1f;
      border-radius: 12px;
      padding: 25px;
      max-width: 420px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      transition: 0.3s ease;
      animation: fadeIn 0.8s ease;
    }

    #playersList h3 {
      margin-top: 0;
      color: #90caf9;
      margin-bottom: 12px;
    }

    #playersList ul {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 1.1em;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    #playersList li {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 12px;
      margin: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      animation: fadeIn 0.6s forwards;
    }

    .player-badge {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 6px currentColor;
    }

    .local-player {
      font-weight: 600;
    }

    input[type=text] {
      padding: 14px;
      border-radius: 8px;
      border: none;
      width: 80%;
      max-width: 320px;
      font-size: 1.1em;
      outline: none;
      margin-bottom: 18px;
      background: #1f1f1f;
      color: #fff;
    }

    button {
      padding: 14px 26px;
      font-size: 1.15em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px 6px;
      transition: all 0.2s ease;
    }

    #joinBtn {
      background-color: #4caf50;
      color: white;
    }
    #joinBtn:hover {
      background-color: #66bb6a;
      transform: translateY(-2px);
    }

    #revealBtn {
      background-color: #2196f3;
      color: white;
    }
    #revealBtn:hover:enabled {
      background-color: #42a5f5;
      transform: translateY(-2px);
    }
    #revealBtn:disabled {
      background-color: #444;
      color: #aaa;
      cursor: not-allowed;
    }

    #newRoundBtn {
      background-color: #555;
      color: #ddd;
    }
    #newRoundBtn:hover {
      background-color: #666;
      transform: translateY(-2px);
    }

    #wordBox {
      margin: 25px auto;
      display: none;
      font-size: 1.5em;
      padding: 18px 28px;
      background-color: #1f1f1f;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255,255,255,0.15);
      width: fit-content;
      color: #fff;
      animation: fadeIn 0.5s ease;
    }

    #waitingMessage {
      font-size: 1.2em;
      color: #aaa;
      margin-top: 15px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      body {
        padding: 20px 10px;
      }
      input[type=text] {
        width: 90%;
      }
      button {
        width: 90%;
        max-width: 300px;
      }
      #playersList {
        padding: 15px;
      }
      #wordBox {
        font-size: 1.3em;
        padding: 14px 20px;
      }
    }
    @media (max-width: 480px) {
      h1 {
        font-size: 2.1em;
      }
      #playersList {
        padding: 18px;
      }
      button {
        width: 90%;
        max-width: 340px;
      }
    }

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  backdrop-filter: blur(6px);
  z-index: 1000;
}

.toast.show {
  opacity: 1;
}

    
  </style>
</head>
<body>
  <h1>🎭 Imposter Game</h1>

  <div>
    <input id="nameInput" type="text" placeholder="Enter your name..." />
    <button id="joinBtn">Join Game</button>
  </div>

  <div id="waitingMessage"></div>

  <div id="playersList" style="display:none;">
    <h3>🧑‍🤝‍🧑 Players in This Round</h3>
    <ul id="playersUl"></ul>
  </div>

  <!-- Category Section -->
  <div id="categorySection" style="display:none; margin-top:20px;">
    <h3>🎯 Category</h3>
    <select id="categorySelect">
      <option value="">-- Select Category --</option>
      <option value="animals">Animals</option>
      <option value="food">Food</option>
      <option value="places">Places</option>
      <option value="objects">Objects</option>
    </select>
    <button id="chooseCategoryBtn">Choose</button>
    <div id="chosenCategory" style="margin-top:10px; font-size:1.2em; color:#ffb74d;"></div>
  </div>

  <div id="waitingCategoryMessage" style="display:none; font-size:1.1em; color:#bbb; margin-top:10px;"></div>

  <button id="revealBtn" disabled style="display:none;">Reveal Word</button>

  <div id="wordBox"></div>

  <button id="newRoundBtn" style="display:none;">Start New Round</button>
  <div id="toast" class="toast"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
  const firebaseConfig = {
    apiKey: "AIzaSyDvpa6IP-gjyVVg_lFizwMNjflqbJMw2uQ",
    authDomain: "imposter-game-515d8.firebaseapp.com",
    databaseURL: "https://imposter-game-515d8-default-rtdb.firebaseio.com",
    projectId: "imposter-game-515d8",
    storageBucket: "imposter-game-515d8.firebasestorage.app",
    messagingSenderId: "727642877069",
    appId: "1:727642877069:web:35f0113718fdde270b06c4"
  };

  // ... (Keep your firebaseConfig and initialization)

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  firebase.auth().signInAnonymously()
    .then(() => initGame())
    .catch(err => alert("Firebase sign-in failed: " + err.message));

  function initGame() {
    const rootRef = db.ref("games");
    const currentRoundRef = rootRef.child("currentRound");

    currentRoundRef.on("value", snapshot => {
      const seed = snapshot.val();
      if (seed) startRound(seed);
    });

    currentRoundRef.once("value").then(snap => {
      if (!snap.exists()) currentRoundRef.set(Math.floor(Math.random() * 1000000));
    });
  }

  // Define words for each category
  const wordBank = {
    animals: ["Lion", "Penguin", "Elephant", "Giraffe", "Hamster", "Shark"],
    food: ["Pizza", "Sushi", "Taco", "Burger", "Pancake", "Pasta"],
    places: ["Paris", "Jungle", "Hospital", "Space Station", "Library", "Beach"],
    objects: ["Guitar", "Smartphone", "Telescope", "Umbrella", "Hammer", "Clock"]
  };

  function startRound(seed) {
    const sessionRef = db.ref("games/" + seed);
    const playersRef = sessionRef.child("players");
    const categoryRef = sessionRef.child("category");
    const imposterRef = sessionRef.child("imposter");
    const wordRef = sessionRef.child("word");

    // UI Elements
    const nameInput = document.getElementById("nameInput");
    const joinBtn = document.getElementById("joinBtn");
    const playersUl = document.getElementById("playersUl");
    const playersListDiv = document.getElementById("playersList");
    const categorySection = document.getElementById("categorySection");
    const categorySelect = document.getElementById("categorySelect");
    const chooseCategoryBtn = document.getElementById("chooseCategoryBtn");
    const chosenCategoryDiv = document.getElementById("chosenCategory");
    const revealBtn = document.getElementById("revealBtn");
    const wordBox = document.getElementById("wordBox");
    const newRoundBtn = document.getElementById("newRoundBtn");
    const waitingCategoryMessage = document.getElementById("waitingCategoryMessage");

    let playerName = null;
    let playerIndex = null;
    let isHost = false;

    // 1. JOIN LOGIC
    joinBtn.onclick = () => {
      const name = nameInput.value.trim();
      if (!name) return alert("Enter your name!");

      playersRef.once("value").then(snap => {
        const players = snap.val() || [];
        playerIndex = players.length;
        playerName = name;
        isHost = (playerIndex === 0);

        playersRef.child(playerIndex).set({ name, color: "#90caf9" });

        nameInput.style.display = "none";
        joinBtn.style.display = "none";
        playersListDiv.style.display = "block";
        
        if (isHost) {
          categorySection.style.display = "block";
        } else {
          waitingCategoryMessage.style.display = "block";
          waitingCategoryMessage.textContent = "Waiting for host to pick a category...";
        }
      });
    };

    // 2. CATEGORY SELECTION (Host Only)
    chooseCategoryBtn.onclick = () => {
      const cat = categorySelect.value;
      if (!cat) return alert("Select a category!");

      playersRef.once("value").then(snap => {
        const players = snap.val() || [];
        if (players.length < 3) return alert("Need at least 3 players!");

        const randomWord = wordBank[cat][Math.floor(Math.random() * wordBank[cat].length)];
        const randomImposter = Math.floor(Math.random() * players.length);

        // Update Firebase
        sessionRef.update({
          category: cat,
          word: randomWord,
          imposter: randomImposter
        });
        
        categorySection.style.display = "none";
      });
    };

    // 3. SYNC PLAYER LIST
    playersRef.on("value", snap => {
      playersUl.innerHTML = "";
      const players = snap.val() || [];
      players.forEach((p, idx) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="player-badge" style="background:${p.color}"></span> ${p.name} ${idx === 0 ? "(Host)" : ""}`;
        if (p.name === playerName) li.classList.add("local-player");
        playersUl.appendChild(li);
      });
    });

    // 4. SYNC GAME STATE (Word & Imposter)
    sessionRef.on("value", snap => {
      const data = snap.val();
      if (data && data.word && data.category) {
        chosenCategoryDiv.textContent = "Category: " + data.category;
        revealBtn.style.display = "inline-block";
        revealBtn.disabled = false;
        revealBtn.textContent = "Reveal Word";
        waitingCategoryMessage.style.display = "none";
        
        // Setup Reveal Logic
        revealBtn.onclick = () => {
          const isImposter = (playerIndex === data.imposter);
          wordBox.innerHTML = isImposter ? "❗ <b>You are the IMPOSTER</b>" : `🗝️ Word: <b>${data.word}</b>`;
          wordBox.style.display = wordBox.style.display === "none" ? "block" : "none";
        };

        // Show Start New Round for Host
        if (isHost) {
          newRoundBtn.style.display = "inline-block";
          newRoundBtn.textContent = "Start New Round";
          newRoundBtn.onclick = () => {
             db.ref("games/currentRound").set(Math.floor(Math.random() * 1000000));
          };
        }
      }
    });
  }
</script>

</body>
</html>
