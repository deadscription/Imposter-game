<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Imposter Game</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #eee;
      text-align: center;
      padding: 30px 15px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { color: #ffb74d; }
    #playersList {
      margin: 25px auto;
      background: #1f1f1f;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    #playersUl {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    #playersUl li {
      background: #333;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .player-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }
    input[type=text], select {
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
      background: #1f1f1f;
      color: #fff;
      width: 80%;
    }
    button {
      padding: 12px 24px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
      transition: opacity 0.3s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #joinBtn { background: #4caf50; color: white; }
    #revealBtn { background: #2196f3; color: white; }
    #newRoundBtn { background: #ffb74d; color: #111; font-weight: bold; }
    #exitGameBtn { background: #f44336; color: white; }
    #wordBox {
      margin: 20px auto;
      padding: 20px;
      background: #333;
      border-radius: 10px;
      border: 2px solid #ffb74d;
      font-size: 1.4em;
    }
    .local-player { border: 1px solid #ffb74d; }

    /* Toast Notification Style */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 30px;
      color: white;
      font-weight: bold;
      display: none;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #toast.show { display: block; animation: fadeInOut 3s forwards; }
    @keyframes fadeInOut {
      0% { opacity: 0; bottom: 10px; }
      15% { opacity: 1; bottom: 20px; }
      85% { opacity: 1; bottom: 20px; }
      100% { opacity: 0; bottom: 10px; }
    }
  </style>
</head>
<body>

  <h1>🎭 Imposter Game</h1>

  <div id="joinScreen">
    <input id="nameInput" type="text" placeholder="Enter your name..." />
    <button id="joinBtn">Join Game</button>
  </div>

  <div id="playersList" style="display:none;">
    <h3>🧑‍🤝‍🧑 Players</h3>
    <ul id="playersUl"></ul>
  </div>

  <div id="categorySection" style="display:none;">
    <h3>🎯 Select a Category</h3>
    <select id="categorySelect">
        <option value="">-- Choose Category --</option>
    </select>
    <br>
    <button id="chooseCategoryBtn" style="background:#ffb74d;">Pick Word & Start</button>
  </div>

  <div id="gameUI">
    <div id="waitingCategoryMessage" style="color:#aaa; margin: 20px;"></div>
    <div id="chosenCategory" style="font-size: 1.2em; color: #ffb74d; margin-bottom: 10px;"></div>
    <button id="revealBtn" style="display:none;">Reveal Word</button>
    <div id="wordBox" style="display:none;"></div>
    <br>
    <button id="newRoundBtn" style="display:none;">Start New Round</button>
    <button id="exitGameBtn" style="display:none;">Exit Game</button>
  </div>

  <div id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDvpa6IP-gjyVVg_lFizwMNjflqbJMw2uQ",
      authDomain: "imposter-game-515d8.firebaseapp.com",
      databaseURL: "https://imposter-game-515d8-default-rtdb.firebaseio.com",
      projectId: "imposter-game-515d8",
      storageBucket: "imposter-game-515d8.firebasestorage.app",
      messagingSenderId: "727642877069",
      appId: "1:727642877069:web:35f0113718fdde270b06c4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let playerName = null, playerIndex = null, isHost = false, currentSeed = null;

  const categories = {
  // Basics
  animals: ["Lion", "Tiger", "Elephant", "Giraffe", "Penguin", "Kangaroo"],
  colors: ["Crimson", "Turquoise", "Lavender", "Emerald", "Magenta", "Gold"],
  countries: ["Japan", "Brazil", "Egypt", "Canada", "Italy", "Australia"],
  
  // Lifestyle
  kitchen_utensils: ["Whisk", "Spatula", "Grater", "Ladle", "Peeler", "Tongs"],
  clothing: ["Scarf", "Mittens", "Belt", "Jacket", "Sweater", "Apron"],
  household_appliances: ["Toaster", "Blender", "Vacuum", "Kettle", "Mixer", "Fridge"],
  footwear: ["Slipper", "High Heel", "Cleat", "Sandal", "Boot", "Sneaker"],

  // Nature
  landmarks: ["Eiffel Tower", "Pyramids", "Colosseum", "Big Ben", "Taj Mahal"],
  weather: ["Blizzard", "Tornado", "Rainbow", "Hurricane", "Thunder", "Fog"],
  trees: ["Palm", "Pine", "Willow", "Oak", "Maple", "Banyan"],
  insects: ["Butterfly", "Mosquito", "Grasshopper", "Beetle", "Ladybug", "Moth"],

  // Food
  fruits_veg: ["Pineapple", "Broccoli", "Pumpkin", "Garlic", "Coconut", "Corn"],
  desserts: ["Cheesecake", "Brownie", "Macaron", "Pudding", "Sorbet", "Muffin"],
  breakfast: ["Omelette", "Waffle", "Bagel", "Pancakes", "Muesli", "Smoothie"],

  // Hobbies
  olympic_sports: ["Archery", "Fencing", "Gymnastics", "Karate", "Sailing", "Judo"],
  musical_instruments: ["Saxophone", "Cello", "Harmonica", "Trumpet", "Harp", "Drums"],
  art_supplies: ["Canvas", "Charcoal", "Easel", "Pastel", "Palette", "Crayons"],
  board_games: ["Chess", "Monopoly", "Scrabble", "Dominoes", "Checkers", "Clue"],

  // Science/Tech
  space: ["Asteroid", "Comet", "Satellite", "Galaxy", "Telescope", "Rocket"],
  vehicles: ["Helicopter", "Submarine", "Tractor", "Scooter", "Bicycle", "Truck"],
  car_parts: ["Windshield", "Engine", "Steering Wheel", "Headlight", "Bumper"],

  // Jobs/Misc
  occupations: ["Firefighter", "Astronaut", "Librarian", "Farmer", "Baker", "Judge"],
  superpowers: ["Invisibility", "Teleportation", "Flight", "Strength", "Healing"],
  fictional_characters: ["Batman", "Sherlock", "Harry Potter", "Spider-Man", "Yoda"],
  mythical_creatures: ["Dragon", "Unicorn", "Phoenix", "Mermaid", "Centaur", "Ghost"],
  body_parts: ["Elbow", "Kidney", "Eyebrow", "Shoulder", "Ankle", "Knuckle"],
  shapes: ["Octagon", "Cylinder", "Pyramid", "Diamond", "Sphere", "Oval"],
  flowers: ["Sunflower", "Tulip", "Orchid", "Daisy", "Rose", "Lavender"],
  school_subjects: ["Biology", "Calculus", "Geography", "History", "Physics", "Art"],
  daily_activities: ["Brushing Teeth", "Cooking", "Exercising", "Gardening", "Reading"]
};

    function showDebugToast(msg, type) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.background = type === "api" ? "#2196f3" : "#ff9800";
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    async function getDynamicWord(catKey) {
      const query = catKey.replace('_', ' ');
      try {
        const res = await fetch(`https://api.datamuse.com/words?ml=${query}&max=20`);
        const data = await res.json();
        const filtered = data.filter(w => !w.word.includes(' ') && w.word.length > 2);
        if (filtered.length > 5) {
          const word = filtered[Math.floor(Math.random() * Math.min(filtered.length, 10))].word.toUpperCase();
          showDebugToast(`Source: API (${word})`, "api");
          return word;
        }
        throw "short";
      } catch (e) {
        const list = categories[catKey];
        const word = list[Math.floor(Math.random() * list.length)].toUpperCase();
        showDebugToast(`Source: Local (${word})`, "local");
        return word;
      }
    }

    document.getElementById("joinBtn").onclick = function() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name || !currentSeed) return;
      const ref = db.ref("games/" + currentSeed + "/players");
      ref.once("value").then(snap => {
        const list = Object.values(snap.val() || {});
        playerIndex = list.length; playerName = name; isHost = (playerIndex === 0);
        return ref.child(playerIndex).set({ name, color: "#90caf9" });
      }).then(() => {
        document.getElementById("joinScreen").style.display = "none";
        document.getElementById("playersList").style.display = "block";
        if (isHost) document.getElementById("categorySection").style.display = "block";
      });
    };

    document.getElementById("chooseCategoryBtn").onclick = async function() {
      const btn = document.getElementById("chooseCategoryBtn");
      const catKey = document.getElementById("categorySelect").value;
      if(!catKey) return alert("Select a category!");
      btn.disabled = true; btn.textContent = "Fetching...";
      
      const word = await getDynamicWord(catKey);
      const sessionRef = db.ref("games/" + currentSeed);
      const playersSnap = await sessionRef.child("players").once("value");
      const imposter = Math.floor(Math.random() * Object.keys(playersSnap.val()).length);

      await sessionRef.update({ category: catKey.replace('_', ' '), word, imposter });
      btn.disabled = false; btn.textContent = "Pick Word & Start";
    };

    document.getElementById("newRoundBtn").onclick = () => db.ref("games/" + currentSeed).update({ category: null, word: null, imposter: null });
    document.getElementById("exitGameBtn").onclick = () => { 
      if(confirm("Exit game for all?")) db.ref("games/"+currentSeed).remove().then(() => db.ref("games/currentRound").set(Math.floor(Math.random()*999999))); 
    };

    firebase.auth().signInAnonymously().then(() => {
      db.ref("games/currentRound").on("value", snapshot => {
        const ns = snapshot.val();
        if (currentSeed && ns !== currentSeed) { playerName = null; playerIndex = null; isHost = false; }
        currentSeed = ns;
        if (currentSeed) { resetGameUI(); attachListeners(currentSeed); }
        else db.ref("games/currentRound").set(Math.floor(Math.random()*999999));
      });
    });

    function resetGameUI() {
      document.getElementById("joinScreen").style.display = playerName ? "none" : "block";
      document.getElementById("playersList").style.display = playerName ? "block" : "none";
      document.getElementById("categorySection").style.display = "none";
      document.getElementById("revealBtn").style.display = "none";
      document.getElementById("wordBox").style.display = "none";
      document.getElementById("newRoundBtn").style.display = "none";
      document.getElementById("exitGameBtn").style.display = "none";
      document.getElementById("chosenCategory").textContent = "";
      document.getElementById("waitingCategoryMessage").textContent = (playerName && !isHost) ? "Waiting for host..." : "";
      document.getElementById("playersUl").innerHTML = "";
      
      const sel = document.getElementById("categorySelect");
      if (sel.options.length <= 1) {
        Object.keys(categories).forEach(k => {
          let o = document.createElement('option'); o.value = k; o.innerHTML = k.replace('_', ' ').toUpperCase();
          sel.appendChild(o);
        });
      }
    }

    function attachListeners(seed) {
      const sessionRef = db.ref("games/" + seed);
      sessionRef.child("players").on("value", snap => {
        const ul = document.getElementById("playersUl"); ul.innerHTML = "";
        Object.values(snap.val() || {}).forEach((p, i) => {
          const li = document.createElement("li");
          if (p.name === playerName && i === playerIndex) li.className = "local-player";
          li.innerHTML = `<span class="player-badge" style="background:${p.color}"></span> ${p.name} ${i === 0 ? "👑" : ""}`;
          ul.appendChild(li);
        });
      });

      sessionRef.on("value", snap => {
        const d = snap.val();
        if (!snap.exists()) { resetGameUI(); return; }
        if (!d.category) {
          document.getElementById("revealBtn").style.display = "none";
          document.getElementById("wordBox").style.display = "none";
          document.getElementById("chosenCategory").textContent = "";
          if (playerName && isHost) { document.getElementById("categorySection").style.display = "block"; document.getElementById("exitGameBtn").style.display = "inline-block"; }
          if (playerName && !isHost) document.getElementById("waitingCategoryMessage").textContent = "Waiting for host...";
          return;
        }
        if (d.category && playerName) {
          document.getElementById("waitingCategoryMessage").textContent = "";
          document.getElementById("categorySection").style.display = "none";
          document.getElementById("chosenCategory").textContent = "Category: " + d.category.toUpperCase();
          document.getElementById("revealBtn").style.display = "inline-block";
          if (isHost) { document.getElementById("newRoundBtn").style.display = "inline-block"; document.getElementById("exitGameBtn").style.display = "inline-block"; }
          document.getElementById("revealBtn").onclick = () => {
            const wb = document.getElementById("wordBox");
            if (wb.style.display === "none") {
              wb.innerHTML = (playerIndex == d.imposter) ? "❗ You are the <b>IMPOSTER</b>" : `🗝️ Word: <b>${d.word}</b>`;
              wb.style.display = "block";
              document.getElementById("revealBtn").textContent = "Hide Word";
            } else { wb.style.display = "none"; document.getElementById("revealBtn").textContent = "Reveal Word"; }
          };
        }
      });
    }
  </script>
</body>
</html>
